<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hajr</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Tajawal,sans-serif;background:#F0F4FA;color:#0D2137;}
#LS{position:fixed;inset:0;background:linear-gradient(160deg,#0D1B2A,#1565C0);z-index:999;display:flex;align-items:center;justify-content:center;padding:18px;}
.LB{background:#fff;border-radius:18px;padding:28px 22px;width:100%;max-width:360px;}
.LB img{width:75px;height:75px;display:block;margin:0 auto 10px;border-radius:13px;}
.LB h1{text-align:center;color:#1565C0;font-size:1.5rem;margin-bottom:3px;}
.LB p{text-align:center;color:#888;font-size:.78rem;margin-bottom:16px;}
.RBS{display:flex;gap:7px;margin-bottom:14px;}
.RB{flex:1;padding:8px 3px;border-radius:8px;border:1.5px solid #E3F0FF;background:#E3F0FF;color:#888;font-family:Tajawal,sans-serif;font-weight:700;font-size:.78rem;cursor:pointer;}
.RB.S{border-color:#1565C0;background:#1565C0;color:#fff;}
.LI{width:100%;padding:11px;border-radius:8px;border:1.5px solid #E3F0FF;font-family:Tajawal,sans-serif;font-size:.92rem;margin-bottom:9px;outline:none;text-align:center;direction:ltr;background:#F5F9FF;color:#0D2137;}
.LI:focus{border-color:#1565C0;}
.LBTN{width:100%;padding:12px;border-radius:8px;border:none;background:linear-gradient(135deg,#F4730E,#FF9800);color:#fff;font-family:Tajawal,sans-serif;font-weight:900;font-size:.97rem;cursor:pointer;}
#LERR{color:#C62828;font-size:.78rem;margin-top:7px;text-align:center;min-height:18px;}
.SI{padding:11px;background:#F5F9FF;border:1.5px solid #E3F0FF;border-radius:9px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:9px;}
#APP{display:none;padding-bottom:72px;}
#BN{position:fixed;bottom:0;left:0;right:0;background:#0D1B2A;display:flex;overflow-x:auto;border-top:1px solid rgba(255,255,255,.1);z-index:100;}
.BI{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 9px;color:rgba(255,255,255,.4);font-size:.56rem;font-weight:700;min-width:50px;flex-shrink:0;cursor:pointer;}
.BI.A{color:#F4730E;}
.PG{display:none;padding:14px;}
.PG.A{display:block;}
.PH{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:7px;}
.PT{font-size:1.25rem;font-weight:900;color:#1565C0;}
.BT{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-family:Tajawal,sans-serif;font-size:.84rem;font-weight:700;}
.BO{background:linear-gradient(135deg,#F4730E,#FF9800);color:#fff;}
.CA{background:#fff;border:1px solid rgba(21,101,192,.1);border-radius:11px;padding:13px;margin-bottom:10px;}
.G2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
.SC{background:#fff;border:1px solid rgba(21,101,192,.1);border-radius:11px;padding:12px;display:flex;align-items:center;gap:9px;}
.HC{background:#fff;border:1px solid rgba(21,101,192,.1);border-radius:11px;overflow:hidden;margin-bottom:9px;}
.HT{background:linear-gradient(135deg,#E3F0FF,#fff);padding:11px 13px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(21,101,192,.07);}
.HA{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#1565C0,#1E88E5);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.HB{padding:11px 13px;}
.OV{display:none;position:fixed;inset:0;background:rgba(13,27,42,.65);z-index:500;align-items:center;justify-content:center;padding:13px;}
.OV.O{display:flex;}
.MD{background:#fff;border-radius:13px;padding:17px;width:100%;max-width:470px;max-height:90vh;overflow-y:auto;}
.MH{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;padding-bottom:9px;border-bottom:2px solid #E3F0FF;}
.FG{margin-bottom:9px;}
.FL{font-size:.71rem;color:#888;margin-bottom:3px;display:block;font-weight:600;}
.FI,.FS{width:100%;padding:9px 10px;background:#F5F9FF;border:1.5px solid #E3F0FF;border-radius:7px;color:#0D2137;font-family:Tajawal,sans-serif;font-size:.84rem;outline:none;}
.FI:focus,.FS:focus{border-color:#1565C0;}
.FR{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
</style>
</head>

  <h1 style="font-size:.95rem;margin-bottom:13px">🏇 إنشاء أسطبل جديد</h1>
  <input class="LI" id="CSN" placeholder="اسم الأسطبل *">
  <input class="LI" id="CAN" placeholder="اسم المدير *">
  <input class="LI" id="CPH" type="tel" placeholder="رقم جوال المدير *">
  <input class="LI" id="CPW" type="password" placeholder="كلمة مرور المدير *">
  <button class="LBTN" id="BCRE">✅ إنشاء الأسطبل</button>
  <button class="LBTN" id="BBCK" style="background:rgba(21,101,192,.1);color:#1565C0;margin-top:7px">← رجوع</button>

<div id="APP">

 <div id="PD" class="PG A">
  <div class="PH">
   <div><div class="PT">🏠 الرئيسية</div><div id="DSN" style="font-size:.73rem;color:#888"></div></div>
   <button class="BT BO" id="BAH">+ إضافة حصان</button>
  </div>
  <div class="G2" id="DST"></div>

<div class="OV" id="OAH">
 <div class="MD">
  <div class="MH"><div style="font-weight:700;color:#1565C0">🐴 إضافة حصان</div><button id="CAH" style="background:none;border:none;font-size:1rem;cursor:pointer">✕</button></div>
  <div class="FR">
   <div class="FG"><label class="FL">الاسم *</label><input class="FI" id="NHN" placeholder="اسم الحصان"></div>
   <div class="FG"><label class="FL">السلالة</label><input class="FI" id="NHB" placeholder="عربي..."></div>
  </div>
  <div class="FR">
   <div class="FG"><label class="FL">الوزن (كغ)</label><input class="FI" id="NHW" type="number" placeholder="400"></div>
   <div class="FG"><label class="FL">اللياقة %</label><input class="FI" id="NHF" type="number" value="70"></div>
  </div>
  <div class="FG"><label class="FL">الحالة</label><select class="FS" id="NHS"><option value="active">✅ نشط</option><option value="rest">😴 راحة</option><option value="ill">🏥 مريض</option></select></div>
  <div class="FG"><label class="FL">ملاحظة</label><textarea class="FI" id="NHT" style="min-height:65px;resize:vertical"></textarea></div>
  <div style="display:flex;gap:7px;margin-top:5px">
   <button class="BT BO" style="flex:1" id="SAH">💾 إضافة</button>
   <button class="BT" style="border:1.5px solid #1565C0;color:#1565C0;background:#fff" id="XAH">إلغاء</button>

<div class="OV" id="OAM">
 <div class="MD">
  <div class="MH"><div style="font-weight:700;color:#1565C0">👥 إضافة عضو</div><button id="CAM" style="background:none;border:none;font-size:1rem;cursor:pointer">✕</button></div>
  <div class="FR">
   <div class="FG"><label class="FL">الاسم *</label><input class="FI" id="MBN" placeholder="الاسم الكامل"></div>
   <div class="FG"><label class="FL">رقم الجوال *</label><input class="FI" id="MBP" type="tel" placeholder="05xxxxxxxx"></div>
  </div>
  <div class="FR">
   <div class="FG"><label class="FL">الدور</label><select class="FS" id="MBR"><option value="admin">👑 مدير</option><option value="rider">🏇 فارس</option><option value="groom">🧹 سايس</option></select></div>
   <div class="FG"><label class="FL">كلمة المرور *</label><input class="FI" id="MBW" type="password"></div>
  </div>
  <div style="display:flex;gap:7px;margin-top:5px">
   <button class="BT BO" style="flex:1" id="SAM">💾 إضافة</button>

  </div>
 </div>

<script>
var DB = "https://hajrteam-default-rtdb.firebaseio.com";
var horses=[], members=[], allStables=[], curSid=null, curUser=null, isSA=false, selRole="admin";
var SA=[{phone:"9999999999",pass:"hajr@2026"}];

function G(id){return document.getElementById(id);}
function GV(id){var e=G(id);return e?e.value:"";}
function SV(id,v){var e=G(id);if(e)e.value=v;}

function saveS(ph,pw,role,sid){
  var v=ph+"|"+pw+"|"+role+"|"+(sid||"");
  try{localStorage.setItem("_hj",v);}catch(e){}
  try{document.cookie="_hj="+encodeURIComponent(v)+";max-age=2592000;path=/";}catch(e){}
}
function getS(){
  var v=null;
  try{v=localStorage.getItem("_hj");}catch(e){}
  if(!v){try{var m=document.cookie.match(/_hj=([^;]+)/);if(m)v=decodeURIComponent(m[1]);}catch(e){}}
  if(!v)return null;
  var p=v.split("|");if(p.length<3)return null;
  return{phone:p[0],pass:p[1],role:p[2],sid:p[3]||""};
}
function clearS(){
  try{localStorage.removeItem("_hj");}catch(e){}
  try{document.cookie="_hj=;max-age=0;path=/";}catch(e){}
}

// REST API calls to Firebase
function fbGet(path){
  return fetch(DB+"/"+path+".json").then(function(r){return r.json();}).catch(function(){return null;});
}
function fbSet(path,data){
  return fetch(DB+"/"+path+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}).then(function(r){return r.json();}).catch(function(){return null;});
}

function fbLoadAll(){
  return fbGet("stables").then(function(d){
    var list=[];
    if(d){var ks=Object.keys(d);for(var i=0;i<ks.length;i++){var k=ks[i],s=d[k],ms=(s.data&&s.data.members)?s.data.members:[];list.push({id:k,name:s.info?s.info.name:k,owner:s.info?s.info.owner:"",members:ms});}}
    allStables=list;return list;
  });
}
function fbLoad(sid){
  return fbGet("stables/"+(sid||curSid)+"/data").then(function(d){
    if(d){if(d.horses)horses=d.horses;if(d.members&&d.members.length)members=d.members;}
  });
}
function fbSave(){
  if(!curSid)return;
  fbSet("stables/"+curSid+"/data",{horses:horses,members:members,t:Date.now()});
}
function fbCreate(sid,sn,an,ph,pw){
  return fbSet("stables/"+sid,{info:{name:sn,owner:an,created:Date.now()},data:{horses:[],members:[{id:Date.now(),name:an,phone:ph,pass:pw,role:"admin"}],t:Date.now()}});
}

function showLB(n){for(var i=0;i<4;i++){var e=G("LB"+i);if(e)e.style.display=i===n?"block":"none";}}

function doLogin(){
  var ph=GV("LP").trim(),pw=GV("LW").trim(),err=G("LERR");
  if(!ph||!pw){err.textContent="أدخل رقم الجوال وكلمة المرور";return;}
  err.textContent="جاري التحقق...";
  var isSup=false;
  for(var i=0;i<SA.length;i++){if(SA[i].phone===ph&&SA[i].pass===pw){isSup=true;break;}}
  if(isSup){
    isSA=true;err.textContent="";
    fbLoadAll().then(function(list){showSAL(list);showLB(2);}).catch(function(){err.textContent="خطأ في الاتصال";});
    return;
  }
  fbLoadAll().then(function(list){
    var found=[];
    for(var i=0;i<list.length;i++){var ms=list[i].members||[];for(var j=0;j<ms.length;j++){if(ms[j].phone===ph&&ms[j].pass===pw&&ms[j].role===selRole)found.push({stable:list[i],user:ms[j]});}}
    if(!found.length){err.textContent="رقم الجوال أو كلمة المرور غير صحيحة";return;}
    err.textContent="";
    if(found.length===1){enterS(found[0].stable.id,found[0].user);}
    else{window._F=found;showUL(found);showLB(1);}
  }).catch(function(){err.textContent="خطأ في الاتصال - تحقق من الإنترنت";});
}

function showSAL(list){
  var el=G("SAL");if(!el)return;el.innerHTML="";
  if(!list.length){el.innerHTML="<div style='text-align:center;padding:14px;color:#888'>لا يوجد أسطبلات</div>";return;}
  for(var i=0;i<list.length;i++){
    var s=list[i],div=document.createElement("div");div.className="SI";
    div.innerHTML="<span style='font-size:1.4rem'>🏇</span><div><div style='font-weight:700;color:#1565C0'>"+s.name+"</div><div style='font-size:.7rem;color:#888'>"+s.owner+"</div></div>";
    (function(idx){div.addEventListener("click",function(){saEnt(idx);});})(i);
    el.appendChild(div);
  }
}
function showUL(found){
  var el=G("SL");if(!el)return;el.innerHTML="";
  for(var i=0;i<found.length;i++){
    var f=found[i],div=document.createElement("div");div.className="SI";
    div.innerHTML="<span style='font-size:1.4rem'>🏇</span><div><div style='font-weight:700;color:#1565C0'>"+f.stable.name+"</div><div style='font-size:.7rem;color:#888'>"+f.user.name+"</div></div>";
    (function(idx){div.addEventListener("click",function(){var f2=window._F[idx];enterS(f2.stable.id,f2.user);});})(i);
    el.appendChild(div);
  }
}
function saEnt(idx){var s=allStables[idx];if(!s)return;curSid=s.id;fbLoad(s.id).then(function(){startApp({name:s.name+" ⭐",phone:"",pass:"",role:"admin"},true);});}
function enterS(sid,user){curSid=sid;saveS(user.phone,user.pass,user.role,sid);fbLoad(sid).then(function(){startApp(user,false);});}

function startApp(user,superMode){
  curUser=user;isSA=superMode;
  G("LS").style.display="none";G("APP").style.display="block";
  buildNav(superMode?["PS"]:["PD","PH","PM"]);
  renderAll();goPage(superMode?"PS":"PD");
}
function doLogout(){clearS();window.location.reload();}

function createStable(){
  var sn=GV("CSN").trim(),an=GV("CAN").trim(),ph=GV("CPH").trim(),pw=GV("CPW").trim();
  var err=G("CERR");
  if(!sn||!an||!ph||!pw){err.textContent="أدخل جميع الحقول";return;}
  err.textContent="جاري الإنشاء...";
  var sid="s_"+Date.now();
  fbCreate(sid,sn,an,ph,pw).then(function(){
    err.textContent="✅ تم إنشاء "+sn;
    SV("CSN","");SV("CAN","");SV("CPH","");SV("CPW","");
    setTimeout(function(){if(isSA){fbLoadAll().then(function(l){showSAL(l);showLB(2);});}else{enterS(sid,{id:Date.now(),name:an,phone:ph,pass:pw,role:"admin"});}},1200);
  }).catch(function(e){err.textContent="خطأ: "+e;});
}

var NV=[{id:"PD",label:"الرئيسية",icon:"🏠"},{id:"PH",label:"الخيل",icon:"🐴"},{id:"PM",label:"الأعضاء",icon:"👥"},{id:"PS",label:"الأسطبلات",icon:"⭐"}];
function buildNav(pages){
  var nav=G("BN");nav.innerHTML="";
  for(var i=0;i<NV.length;i++){
    if(pages.indexOf(NV[i].id)===-1)continue;
    var div=document.createElement("div");div.className="BI";div.id="BI"+NV[i].id;
    div.innerHTML="<div style='font-size:1.1rem'>"+NV[i].icon+"</div><span>"+NV[i].label+"</span>";
    (function(pid){div.addEventListener("click",function(){goPage(pid);});})(NV[i].id);
    nav.appendChild(div);
  }
  var lo=document.createElement("div");lo.className="BI";lo.innerHTML="<div style='font-size:1.1rem'>🚪</div><span>خروج</span>";lo.addEventListener("click",doLogout);nav.appendChild(lo);
}
function goPage(id){
  var pgs=["PD","PH","PM","PS"];
  for(var i=0;i<pgs.length;i++){var pg=G(pgs[i]);if(pg)pg.className=pgs[i]===id?"PG A":"PG";var bn=G("BI"+pgs[i]);if(bn)bn.className=pgs[i]===id?"BI A":"BI";}
  window.scrollTo(0,0);if(id==="PS")renderSP();
}

var SLB={active:"نشط",rest:"راحة",ill:"مريض"};
var SLC={active:"#2E7D32",rest:"#E65100",ill:"#C62828"};
function addHorse(){
  var n=GV("NHN").trim();if(!n){alert("أدخل اسم الحصان");return;}
  horses.push({name:n,breed:GV("NHB")||"غير محدد",weight:parseInt(GV("NHW"))||400,fitness:Math.min(100,Math.max(0,parseInt(GV("NHF"))||70)),status:GV("NHS"),note:GV("NHT")});
  SV("NHN","");SV("NHB","");SV("NHW","");SV("NHT","");SV("NHF","70");
  G("OAH").classList.remove("O");renderAll();fbSave();
}
function renderH(cid){
  var el=G(cid);if(!el)return;
  if(!horses.length){el.innerHTML="<div style='text-align:center;padding:18px;color:#888'>🐴<br>لا يوجد خيل</div>";return;}
  el.innerHTML="";
  for(var i=0;i<horses.length;i++){
    var h=horses[i],col=SLC[h.status]||"#1565C0",lbl=SLB[h.status]||h.status;
    var d=document.createElement("div");d.className="HC";
    d.innerHTML="<div class='HT'><div class='HA'>🐎</div><div><div style='font-size:.88rem;font-weight:700;color:#1565C0'>"+h.name+"</div><div style='font-size:.66rem;color:#888'>"+h.breed+"</div></div><span style='margin-right:auto;background:"+col+"22;color:"+col+";border:1px solid "+col+"44;border-radius:11px;padding:2px 7px;font-size:.66rem;font-weight:700'>"+lbl+"</span></div><div class='HB'><div style='display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px'><span style='color:#888'>الوزن</span><span style='font-weight:600'>"+h.weight+" كغ</span></div><div style='height:4px;background:#E3F0FF;border-radius:3px;margin-top:7px'><div style='height:100%;width:"+h.fitness+"%;background:linear-gradient(90deg,#1565C0,#1E88E5);border-radius:3px'></div></div><div style='display:flex;justify-content:space-between;margin-top:2px;font-size:.62rem;color:#888'><span>لياقة</span><span>"+h.fitness+"%</span></div></div></div>";
    el.appendChild(d);
  }
}
function addMember(){
  var n=GV("MBN").trim(),ph=GV("MBP").trim(),pw=GV("MBW").trim(),role=GV("MBR");
  if(!n||!ph||!pw){alert("أدخل جميع الحقول");return;}
  for(var i=0;i<members.length;i++){if(members[i].phone===ph){alert("رقم الجوال مسجل مسبقاً");return;}}
  members.push({id:Date.now(),name:n,phone:ph,pass:pw,role:role});
  SV("MBN","");SV("MBP","");SV("MBW","");
  G("OAM").classList.remove("O");renderM();fbSave();
}
function renderM(){
  var el=G("ML");if(!el)return;
  if(!members.length){el.innerHTML="<div style='text-align:center;padding:18px;color:#888'>لا يوجد أعضاء</div>";return;}
  el.innerHTML="";
  var RL={admin:"👑 مدير",rider:"🏇 فارس",groom:"🧹 سايس"};
  for(var i=0;i<members.length;i++){
    var m=members[i],div=document.createElement("div");div.className="CA";div.style.cssText="display:flex;align-items:center;gap:9px;margin-bottom:7px";
    div.innerHTML="<div style='width:36px;height:36px;border-radius:50%;background:rgba(21,101,192,.1);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0'>"+(RL[m.role]||"👤").split(" ")[0]+"</div><div><div style='font-weight:700;color:#1565C0'>"+m.name+"</div><div style='font-size:.71rem;color:#888'>"+(RL[m.role]||m.role)+" • "+m.phone+"</div></div>";
    el.appendChild(div);
  }
}
function renderSP(){
  fbLoadAll().then(function(list){
    var el=G("SG");if(!el)return;
    if(!list.length){el.innerHTML="<div style='text-align:center;padding:18px;color:#888'>🏇<br>لا يوجد أسطبلات</div>";return;}
    el.innerHTML="";
    for(var i=0;i<list.length;i++){
      var s=list[i],card=document.createElement("div");card.className="CA";card.style.marginBottom="9px";
      var btn=document.createElement("button");btn.className="BT BO";btn.style.cssText="padding:5px 11px;font-size:.78rem;margin-top:7px";btn.textContent="🚀 دخول";
      (function(idx){btn.addEventListener("click",function(){saEnt(idx);});})(i);
      card.innerHTML="<div style='font-weight:700;color:#1565C0'>🏇 "+s.name+"</div><div style='font-size:.71rem;color:#888;margin-top:2px'>"+s.owner+" • "+s.members.length+" أعضاء</div>";
      card.appendChild(btn);el.appendChild(card);
    }
  });
}
function renderAll(){
  var active=0;for(var i=0;i<horses.length;i++)if(horses[i].status==="active")active++;
  var st=G("DST");if(st)st.innerHTML="<div class='SC'><div style='width:36px;height:36px;border-radius:9px;background:rgba(21,101,192,.1);display:flex;align-items:center;justify-content:center;font-size:1rem'>🐴</div><div><div style='font-size:1.25rem;font-weight:900;color:#1565C0'>"+horses.length+"</div><div style='font-size:.68rem;color:#888'>إجمالي الخيل</div></div></div><div class='SC'><div style='width:36px;height:36px;border-radius:9px;background:rgba(46,125,50,.1);display:flex;align-items:center;justify-content:center;font-size:1rem'>✅</div><div><div style='font-size:1.25rem;font-weight:900;color:#1565C0'>"+active+"</div><div style='font-size:.68rem;color:#888'>نشطة</div></div></div>";
  renderH("DH");renderH("HG");renderM();
  var sn=G("DSN");if(sn)for(var i=0;i<allStables.length;i++)if(allStables[i].id===curSid){sn.textContent=allStables[i].name;break;}
}

window.addEventListener("load",function(){
  G("LBTN").addEventListener("click",doLogin);
  G("LW").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
  G("RB0").addEventListener("click",function(){selRole="admin";G("RB0").className="RB S";G("RB1").className="RB";G("RB2").className="RB";});
  G("RB1").addEventListener("click",function(){selRole="rider";G("RB0").className="RB";G("RB1").className="RB S";G("RB2").className="RB";});
  G("RB2").addEventListener("click",function(){selRole="groom";G("RB0").className="RB";G("RB1").className="RB";G("RB2").className="RB S";});
  G("BSUP").addEventListener("click",function(){showLB(3);});
  G("BSAN").addEventListener("click",function(){showLB(3);});
  G("BBCK").addEventListener("click",function(){showLB(isSA?2:1);});
  G("BCRE").addEventListener("click",createStable);
  G("BAH").addEventListener("click",function(){G("OAH").classList.add("O");});
  G("BAH2").addEventListener("click",function(){G("OAH").classList.add("O");});
  G("SAH").addEventListener("click",addHorse);
  G("CAH").addEventListener("click",function(){G("OAH").classList.remove("O");});
  G("XAH").addEventListener("click",function(){G("OAH").classList.remove("O");});
  G("BAM").addEventListener("click",function(){G("OAM").classList.add("O");});
  G("SAM").addEventListener("click",addMember);
  G("CAM").addEventListener("click",function(){G("OAM").classList.remove("O");});
  G("XAM").addEventListener("click",function(){G("OAM").classList.remove("O");});
  G("BSC").addEventListener("click",function(){SV("CSN","");SV("CAN","");SV("CPH","");SV("CPW","");G("CERR").textContent="";showLB(3);});
  document.querySelectorAll(".OV").forEach(function(ov){ov.addEventListener("click",function(e){if(e.target===ov)ov.classList.remove("O");});});
  // Auto login
  var s=getS();if(!s||!s.phone)return;
  G("LS").innerHTML="<div style='text-align:center;color:#fff;font-family:Tajawal,sans-serif;padding:50px 18px'><div style='font-size:2.8rem;margin-bottom:10px'>🐎</div><div style='font-size:1.25rem;font-weight:900;color:#F4730E;margin-bottom:6px'>Hajr</div><div style='opacity:.7'>جاري التحميل...</div></div>";
  var sup=false;for(var i=0;i<SA.length;i++)if(SA[i].phone===s.phone&&SA[i].pass===s.pass){sup=true;break;}
  if(sup){isSA=true;fbLoadAll().then(function(){startApp({name:"Super Admin",phone:s.phone,pass:s.pass,role:"admin"},true);});return;}
  if(!s.sid){clearS();window.location.reload();return;}
  curSid=s.sid;
  fbLoadAll().then(function(list){
    var st=null;for(var i=0;i<list.length;i++)if(list[i].id===s.sid){st=list[i];break;}
    if(!st){clearS();window.location.reload();return;}
    var us=null;for(var j=0;j<st.members.length;j++)if(st.members[j].phone===s.phone&&st.members[j].pass===s.pass&&st.members[j].role===s.role){us=st.members[j];break;}
    if(!us){clearS();window.location.reload();return;}
    fbLoad(s.sid).then(function(){startApp(us,false);});
  }).catch(function(){clearS();window.location.reload();});
});
</script>
